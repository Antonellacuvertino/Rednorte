server.port=8081
spring.application.name=servicio-pacientes
spring.datasource.url=jdbc:h2:file:./data/ms-pacientes-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.jpa.defer-datasource-initialization=true
security.jwt.secret=${JWT_SECRET:rednorte-super-secret-key-para-firmar-jwt-real-2026}
springdoc.swagger-ui.path=/swagger-ui.html
