name: Reporte de error
description: Registra un defecto reproducible.
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Descripcion
      description: Explica el comportamiento observado y esperado.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Componente
      placeholder: frontend, BFF o microservicio
    validations:
      required: true
