apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-pacientes
  namespace: rednorte
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-pacientes
  template:
    metadata:
      labels:
        app: ms-pacientes
    spec:
      containers:
        - name: ms-pacientes
          image: public.ecr.aws/docker/library/eclipse-temurin:17-jre-alpine
          ports:
            - containerPort: 8081
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rednorte-secrets
                  key: JWT_SECRET
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 30
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 60
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ms-pacientes
  namespace: rednorte
spec:
  selector:
    app: ms-pacientes
  ports:
    - port: 8081
      targetPort: 8081
---
