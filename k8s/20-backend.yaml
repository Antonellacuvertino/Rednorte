apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-rednorte
  namespace: rednorte
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bff-rednorte
  template:
    metadata:
      labels:
        app: bff-rednorte
    spec:
      containers:
        - name: bff-rednorte
          image: public.ecr.aws/docker/library/eclipse-temurin:17-jre-alpine
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: rednorte-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rednorte-secrets
                  key: JWT_SECRET
            - name: DEMO_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: rednorte-secrets
                  key: DEMO_USER_EMAIL
            - name: DEMO_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rednorte-secrets
                  key: DEMO_USER_PASSWORD
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rednorte-secrets
                  key: RABBITMQ_USERNAME
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rednorte-secrets
                  key: RABBITMQ_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 35
          livenessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 70
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bff-rednorte
  namespace: rednorte
spec:
  selector:
    app: bff-rednorte
  ports:
    - port: 8085
      targetPort: 8085
