server.port=8085
security.jwt.secret=${JWT_SECRET:rednorte-super-secret-key-para-firmar-jwt-real-2026}
security.jwt.expiration-minutes=120
security.demo-user.name=${DEMO_USER_NAME:Medico RedNorte}
security.demo-user.email=${DEMO_USER_EMAIL:medico@redsalud.cl}
security.demo-user.password=${DEMO_USER_PASSWORD:salud1234}

feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000

# URL de los microservicios
ms.pacientes.url=http://localhost:8081
ms.citas.url=http://localhost:8082
ms.lista-espera.url=http://localhost:8083
ms.reasignacion.url=http://localhost:8084
ms.auditoria.url=http://localhost:8086
ms.notificaciones.url=http://localhost:8087

# Configuración de logging
logging.level.root=INFO
logging.level.cl.duoc.rednorte=DEBUG

# Otras configuraciones necesarias
spring.application.name=bff-rednorte
spring.cloud.openfeign.enabled=true

# Cache Redis para lecturas frecuentes del BFF.
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.redis.time-to-live=600000

# RabbitMQ para eventos de auditoria e integracion asincrona.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
rednorte.rabbit.exchange=rednorte.events
rednorte.rabbit.routing-key=audit.events
