server.port=8084
spring.application.name=servicio-reasignacion

# Base de datos propia del microservicio
spring.datasource.url=jdbc:h2:file:./data/reasignacion-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# URLs de los microservicios
ms.citas.url=http://localhost:8082

# Configuracion de logging
logging.level.root=INFO
logging.level.com.rednorte.servicio_reasignacion=DEBUG
security.jwt.secret=${JWT_SECRET:rednorte-super-secret-key-para-firmar-jwt-real-2026}
springdoc.swagger-ui.path=/swagger-ui.html
